<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocChat – RAG Document Assistant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar border-bottom px-3">
  <span class="navbar-brand mb-0 h5"><i class="bi bi-file-earmark-text me-2"></i>DocChat</span>
  <div class="d-flex gap-2">
    <button class="btn btn-outline-secondary btn-sm d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#side"><i class="bi bi-folder2-open"></i></button>
    <button id="clearBtn" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i> <span class="d-none d-sm-inline">Clear chat</span></button>
    <button id="themeBtn" class="btn btn-outline-secondary btn-sm" title="Toggle theme"><i class="bi bi-moon-stars"></i></button>
  </div>
</nav>

<div class="app d-flex">
  <aside id="side" class="offcanvas-lg offcanvas-start border-end p-3">
    <h6 class="d-flex justify-content-between">Documents <button class="btn-close d-lg-none" data-bs-dismiss="offcanvas"></button></h6>
    <label class="drop w-100 text-center p-3 rounded mb-3" for="fileInput">
      <i class="bi bi-cloud-upload fs-3"></i>
      <div class="small">Click to upload<br><span class="text-body-secondary">PDF, TXT, DOCX, CSV (max 10MB)</span></div>
      <input id="fileInput" type="file" accept=".pdf,.txt,.docx,.csv" hidden>
    </label>
    <div id="uploadStatus" class="small mb-2"></div>
    <ul id="docList" class="list-group list-group-flush"></ul>
  </aside>

  <main class="flex-grow-1 d-flex flex-column">
    <div id="messages" class="flex-grow-1 overflow-auto p-3">
      <div class="text-center text-body-secondary mt-5" id="empty">
        <i class="bi bi-chat-dots fs-1"></i>
        <p>Upload a document, then ask questions about it.<br>Answers come only from your files.</p>
      </div>
    </div>
    <div id="alertBox" class="px-3"></div>
    <form id="chatForm" class="p-3 border-top d-flex gap-2">
      <input id="question" class="form-control" placeholder="Ask about your documents…" autocomplete="off">
      <button id="sendBtn" class="btn btn-primary"><i class="bi bi-send"></i></button>
    </form>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
